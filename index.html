<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <title>
      The Vedic Universe | Inspired by Ancient Scriptures, Perfected for Modern Life.
    </title>

    <meta
      name="description"
      content="The Vedic Universe is an Indian Ayurvedic wellness brand inspired by ancient Indian knowledge, traditional botanicals and thoughtful everyday wellness."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="author"
      content="The Vedic Universe"
    />

    <meta
      name="theme-color"
      content="#4A1710"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://thevedicuniverse.com/"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="The Vedic Universe"
    />

    <meta
      property="og:title"
      content="The Vedic Universe | Inspired by Ancient Scriptures, Perfected for Modern Life."
    />

    <meta
      property="og:description"
      content="An Indian Ayurvedic wellness brand inspired by ancient Indian knowledge, traditional botanicals and thoughtful everyday wellness."
    />

    <meta
      property="og:url"
      content="https://thevedicuniverse.com/"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- Open Graph Image -->
    <meta
      property="og:image"
      content="https://thevedicuniverse.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="The Vedic Universe Ayurvedic wellness brand"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="The Vedic Universe | Ancient Wisdom for Modern Life"
    />

    <meta
      name="twitter:description"
      content="An Indian Ayurvedic wellness brand inspired by ancient Indian knowledge, traditional botanicals and thoughtful everyday wellness."
    />

    <meta
      name="twitter:image"
      content="https://thevedicuniverse.com/og-image.jpg"
    />

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Vedic Universe",
        "url": "https://thevedicuniverse.com/",
        "description": "An Indian Ayurvedic wellness brand inspired by ancient Indian knowledge, traditional botanicals and thoughtful everyday wellness.",
        "slogan": "Inspired by Ancient Scriptures, Perfected for Modern Life."
      }
    </script>
  </head>

  <body
    class="bg-[#DDB477] text-[#560C05] antialiased selection:bg-[#D99A24] selection:text-[#FFF5E5]"
  >
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
